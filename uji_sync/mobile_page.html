<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b8003a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="UJI Sync">
<link rel="manifest" href="/manifest.json">
<title>UJI Sync</title>
<style>
  :root {
    --bg: #f6f6f7; --card: #ffffff; --text: #1d1d1f; --muted: #6e6e73;
    --line: #e2e2e6; --accent: #b8003a; --accent-text: #ffffff; --me: #fbe7ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111113; --card: #1c1c1f; --text: #f2f2f4; --muted: #9a9aa2;
      --line: #2e2e33; --accent: #ff4d7d; --accent-text: #111113; --me: #3a1a25;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: calc(env(safe-area-inset-top) + 12px) 16px 10px;
    background: var(--card); border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0; font-size: 18px; }
  main { flex: 1; overflow-y: auto; padding: 16px; }
  nav {
    display: flex; background: var(--card); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex: 1; border: 0; background: none; color: var(--muted);
    padding: 10px 4px 12px; font-size: 13px;
  }
  nav button span { display: block; font-size: 22px; }
  nav button.active { color: var(--accent); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .muted { color: var(--muted); font-size: 14px; }
  .btn {
    display: inline-block; border: 0; border-radius: 12px; padding: 12px 16px;
    background: var(--accent); color: var(--accent-text); font-size: 16px; font-weight: 600;
  }
  .btn.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .btn:disabled { opacity: .5; }
  input, select, textarea {
    width: 100%; font: inherit; color: var(--text); background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px;
  }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { flex: 1; }
  .row > .btn { flex: none; }
  .msg { padding: 10px 12px; border-radius: 14px; margin: 8px 0; max-width: 92%; overflow-wrap: anywhere; }
  .msg.me { background: var(--me); margin-left: auto; }
  .msg.bot { background: var(--card); border: 1px solid var(--line); }
  .msg.info { color: var(--muted); font-size: 14px; padding: 2px 4px; }
  .msg h3, .msg h4 { margin: 8px 0 4px; font-size: 16px; }
  .msg ul, .msg ol { padding-left: 20px; margin: 4px 0; }
  .msg p { margin: 6px 0; }
  code { background: var(--bg); padding: 1px 4px; border-radius: 4px; }
  .composer {
    position: sticky; bottom: -16px; background: var(--bg); padding: 8px 0 16px;
  }
  .composer textarea { resize: none; height: 52px; }
  pre.result { white-space: pre-wrap; font: inherit; margin: 0; }
  ul.plain { list-style: none; padding: 0; margin: 0; }
  ul.plain li { padding: 6px 0; border-bottom: 1px solid var(--line); }
  ul.plain li:last-child { border-bottom: 0; }
  .hidden { display: none !important; }
  #login { max-width: 360px; margin: 10vh auto 0; text-align: center; }
  #pin { text-align: center; font-size: 28px; letter-spacing: 8px; margin: 16px 0; }
</style>
</head>
<body>
<header><h1>🎓 UJI Sync</h1></header>

<main>
  <section id="login">
    <p>Escribe el PIN que aparece en UJI Sync, en tu PC.</p>
    <input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••">
    <button class="btn" id="login-btn" style="width:100%">Entrar</button>
    <p class="muted" id="login-error"></p>
  </section>

  <section id="tab-chat" class="hidden">
    <div class="row" style="margin-bottom:8px">
      <select id="course"></select>
      <button class="btn secondary" id="new-chat">Nueva</button>
    </div>
    <div id="messages"></div>
    <div class="composer">
      <div class="row">
        <textarea id="question" placeholder="Pregunta sobre tus materiales…"></textarea>
        <button class="btn" id="send">➤</button>
      </div>
      <div class="muted" id="cost"></div>
    </div>
  </section>

  <section id="tab-notes" class="hidden">
    <div class="card">
      <b>Subir apuntes</b>
      <p class="muted">Fotos de tus apuntes, PDF, Word o PowerPoint. Se guardan en la bandeja del PC.</p>
      <label class="btn" style="width:100%;text-align:center">
        📷 Hacer foto o elegir archivos
        <input id="files" type="file" multiple class="hidden"
               accept="image/jpeg,image/png,image/webp,.pdf,.docx,.pptx,.txt,.md">
      </label>
      <p class="muted" id="upload-status"></p>
    </div>
    <div class="card">
      <b>En la bandeja</b>
      <ul class="plain" id="inbox"></ul>
      <button class="btn" id="organize" style="width:100%;margin-top:10px">🗂 Organizar mis apuntes</button>
      <pre class="result muted" id="organize-result"></pre>
    </div>
  </section>

  <section id="tab-news" class="hidden"><div id="news"></div></section>
</main>

<nav id="nav" class="hidden">
  <button data-tab="chat" class="active"><span>💬</span>Asistente</button>
  <button data-tab="notes"><span>📝</span>Apuntes</button>
  <button data-tab="news"><span>🆕</span>Novedades</button>
</nav>

<script>
const $ = (id) => document.getElementById(id);
let conversation = null;

async function api(path, options = {}) {
  const r = await fetch(path, { credentials: "same-origin", ...options });
  const data = await r.json().catch(() => ({ error: "Respuesta no válida" }));
  if (r.status === 401 && path !== "/api/login") showLogin();
  if (!r.ok && !data.error) data.error = "Error " + r.status;
  return data;
}

function esc(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Markdown mínimo: se escapa todo primero, así que nunca se inserta HTML de la respuesta.
function md(text) {
  const inline = (s) => s
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*(?!\s)(.+?)\*/g, "$1<i>$2</i>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
  let html = "", list = null;
  for (const raw of esc(text).split("\n")) {
    const line = raw.trimEnd();
    const ul = line.match(/^\s*[-*] (.*)/), ol = line.match(/^\s*\d+[.)] (.*)/);
    const kind = ul ? "ul" : ol ? "ol" : null;
    if (list && kind !== list) { html += `</${list}>`; list = null; }
    if (kind) {
      if (!list) { html += `<${kind}>`; list = kind; }
      html += `<li>${inline((ul || ol)[1])}</li>`;
    } else if (/^#{1,4} /.test(line)) {
      html += `<h4>${inline(line.replace(/^#+ /, ""))}</h4>`;
    } else if (line) {
      html += `<p>${inline(line)}</p>`;
    }
  }
  return html + (list ? `</${list}>` : "");
}

function addMsg(kind, html) {
  const div = document.createElement("div");
  div.className = "msg " + kind;
  div.innerHTML = html;
  $("messages").appendChild(div);
  div.scrollIntoView({ block: "end" });
  return div;
}

function showLogin() {
  $("login").classList.remove("hidden");
  $("nav").classList.add("hidden");
  for (const t of ["chat", "notes", "news"]) $("tab-" + t).classList.add("hidden");
}

function showTab(name) {
  $("login").classList.add("hidden");
  $("nav").classList.remove("hidden");
  for (const b of document.querySelectorAll("nav button")) b.classList.toggle("active", b.dataset.tab === name);
  for (const t of ["chat", "notes", "news"]) $("tab-" + t).classList.toggle("hidden", t !== name);
  if (name === "notes") loadInbox();
  if (name === "news") loadNews();
}

async function start() {
  const data = await api("/api/courses");
  if (data.error) return;
  $("course").innerHTML = '<option value="">Todas las asignaturas</option>' +
    data.courses.map((c) => `<option>${esc(c)}</option>`).join("");
  newChat();
  showTab("chat");
}

function newChat() {
  conversation = null;
  $("messages").innerHTML = "";
  $("cost").textContent = "";
  const scope = $("course").value || "todas tus asignaturas";
  addMsg("info", `Pregúntame sobre ${esc(scope)}: dudas, explicaciones, qué entra en un tema, preguntas de repaso…`);
}

async function send() {
  const question = $("question").value.trim();
  if (!question) return;
  $("question").value = "";
  $("send").disabled = true;
  addMsg("me", esc(question));
  const thinking = addMsg("info", "Pensando… (puede tardar un poco si tiene que leer documentos)");
  const data = await api("/api/chat", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ conversation, course: $("course").value || null, question }),
  });
  thinking.remove();
  $("send").disabled = false;
  if (data.error) { addMsg("info", "⚠ " + esc(data.error)); return; }
  conversation = data.conversation;
  for (const r of data.reads) addMsg("info", "📖 Ha leído " + esc(r));
  addMsg("bot", md(data.answer));
  $("cost").textContent = "Coste de la conversación: " + data.cost.toFixed(2).replace(".", ",") + " US$";
}

async function loadInbox() {
  const data = await api("/api/inbox");
  const files = data.files || [];
  $("inbox").innerHTML = files.length
    ? files.map((f) => `<li>${esc(f)}</li>`).join("")
    : '<li class="muted">La bandeja está vacía.</li>';
  $("organize").disabled = !files.length;
}

async function upload(fileList) {
  const files = [...fileList];
  for (let i = 0; i < files.length; i++) {
    $("upload-status").textContent = `Subiendo ${i + 1} de ${files.length}…`;
    const data = await api("/api/upload", {
      method: "POST", headers: { "X-Filename": encodeURIComponent(files[i].name) }, body: files[i],
    });
    if (data.error) { $("upload-status").textContent = "⚠ " + data.error; return; }
  }
  $("upload-status").textContent = `✓ ${files.length} archivo(s) en la bandeja.`;
  $("files").value = "";
  loadInbox();
}

async function organize() {
  const n = $("inbox").querySelectorAll("li:not(.muted)").length;
  if (!confirm(`Se enviarán ${n} archivo(s) a Claude para colocarlos en su asignatura y tema (coste pequeño). ¿Seguir?`)) return;
  $("organize").disabled = true;
  $("organize-result").textContent = "Organizando…";
  const data = await api("/api/organize", { method: "POST" });
  $("organize-result").textContent = data.error || data.result;
  loadInbox();
}

async function loadNews() {
  const data = await api("/api/news");
  const news = data.news || [];
  $("news").innerHTML = news.length ? news.map((n) => `
    <div class="card"><b>${esc(n.course)}</b> <span class="muted">· ${esc(n.when)}</span>
      <ul class="plain">${n.items.map((i) => `<li>${md(i.replace(/\]\(<[^>]*>\)/g, "]").replace(/\[([^\]]+)\]/g, "$1"))}</li>`).join("")}</ul>
    </div>`).join("")
    : '<p class="muted">Aún no hay novedades. Aparecen cuando se resumen materiales nuevos con la IA.</p>';
}

$("login-btn").onclick = async () => {
  const data = await api("/api/login", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ pin: $("pin").value.trim() }),
  });
  if (data.error) { $("login-error").textContent = data.error; return; }
  $("login-error").textContent = "";
  start();
};
$("pin").addEventListener("keydown", (e) => { if (e.key === "Enter") $("login-btn").click(); });
$("send").onclick = send;
$("question").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("new-chat").onclick = newChat;
$("course").onchange = newChat;
$("files").onchange = (e) => upload(e.target.files);
$("organize").onclick = organize;
for (const b of document.querySelectorAll("nav button")) b.onclick = () => showTab(b.dataset.tab);

// Si ya hay sesión (cookie), entrar directamente.
api("/api/courses").then((d) => { if (!d.error) start(); });
</script>
</body>
</html>
